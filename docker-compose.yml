services:

  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgresData:/var/lib/postgresql
    networks:
      - dbNetwork
      - cicdNetwork
      - appNetwork

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
    volumes:
      - mysqlData:/var/lib/mysql
    networks:
      - dbNetwork

volumes:
  postgresData:
    name: postgresData

  mysqlData:
    name: mysqlData

networks:
  dbNetwork:
    name: dbNetwork

  cicdNetwork:
    external: true
    name: cicdNetwork
  
  appNetwork:
    external: true
    name: appNetwork
